[package]
name = "trimtown"
version = "0.1.0"
description = "Frame-accurate video trimmer"
authors = ["NotGovernor"]
license-file = "../LICENSE"
edition = "2021"

[lib]
name = "trimtown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset required: tauri.conf.json assetProtocol.enable = true (empty features fails tauri-build)
# image-png required: Image::from_bytes(include_bytes!(icon.png)) in lib.rs setup / window.set_icon
tauri = { version = "2", features = ["protocol-asset", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
thiserror = "2"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
strip = true
